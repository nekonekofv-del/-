name: Build BikeRacer IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build archive (unsigned)
        run: |
          xcodebuild -project BikeRacer.xcodeproj -scheme BikeRacer \
            -configuration Release \
            -archivePath build/BikeRacer.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/BikeRacer.xcarchive/Products/Applications/BikeRacer.app build/Payload/
          cd build && zip -qr BikeRacer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BikeRacer-unsigned-ipa
          path: build/BikeRacer.ipa
